name: Build Lume (Linux)

# Binario nativo para Linux (janela Qt). Duas versoes:
#  - Lume-linux: a normal; nas tags v* vai para a Release.
#  - Lume-linux-owner: so para o dono (nunca abre a porta para a rede); fica so como artefato do workflow, nunca na Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        variant: [normal, owner]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Bibliotecas do sistema (Qt WebEngine)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0
      - name: Instalar dependencias
        run: pip install -r requirements.txt "pywebview[qt]" pyinstaller
      - name: Gerar o binario
        run: python build_linux.py ${{ matrix.variant == 'owner' && '--owner' || '' }}
      - name: Conferir que o binario existe
        run: ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Lume-linux-${{ matrix.variant }}
          path: dist/Lume-linux*
          retention-days: 30
      - name: Publicar na Release (so a versao normal, so em tags v*)
        if: matrix.variant == 'normal' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Lume-linux
