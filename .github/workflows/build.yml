name: Build Lume.exe

# A cada push no main gera o Lume.exe e guarda como artefato; nas tags v* publica o .exe numa Release
# (o app, quando roda como .exe, procura as atualizacoes nessas Releases).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-build.txt
      - name: Gerar Lume.exe
        run: python build_exe.py
      - name: Gerar o instalador (Inno Setup, ja vem no runner)
        shell: pwsh
        run: |
          $ver = (Select-String -Path app.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer\lume.iss
          if (-not (Test-Path dist\Lume-Setup.exe)) { throw "o instalador nao foi gerado" }
      - uses: actions/upload-artifact@v4
        with:
          name: Lume-windows
          path: |
            dist/Lume.exe
            dist/Lume-Setup.exe
          retention-days: 30
      - name: Texto da Release (a secao do CHANGELOG)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python .github/scripts/release_notes.py ${{ github.ref_name }}
      - name: Publicar na Release (so em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Lume.exe
            dist/Lume-Setup.exe
          body_path: release_notes.md
