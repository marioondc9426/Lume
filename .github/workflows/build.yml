name: Build Qwen.exe

# A cada push no main gera o Qwen.exe e guarda como artefato; nas tags v* publica o .exe numa Release
# (o app, quando roda como .exe, procura as atualizacoes nessas Releases).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-build.txt
      - name: Gerar Qwen.exe
        run: python build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: Qwen-windows
          path: dist/Qwen.exe
          retention-days: 30
      - name: Publicar na Release (so em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Qwen.exe
          generate_release_notes: true
