name: Build Lume (macOS Intel)

# Lume.app para Mac Intel (roda tambem nos Apple Silicon pelo Rosetta). Nao e assinado pela Apple: na primeira vez, botao direito > Abrir.
# Nas tags v* o .zip vai para a Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-13   # Mac Intel (x86_64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt pyinstaller pillow
      - name: Gerar o Lume.app
        run: python build_mac.py
      - uses: actions/upload-artifact@v4
        with:
          name: Lume-macos-intel
          path: dist/Lume-macos-intel.zip
          retention-days: 30
      - name: Publicar na Release (so em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Lume-macos-intel.zip
