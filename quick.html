<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lume Rapido</title>
<!-- A caixinha do Alt+Espaco: uma janela pequena, sem borda, sempre por cima. Digitou e mandou, a conversa aparece flutuando logo abaixo.
     Alt+Espaco de novo, Esc ou clicar fora esconde (a conversa fica guardada ate fechar o Lume). Nao grava nada nos chats do app (so le o modelo escolhido). -->
<style>
:root { --bg: rgba(29, 30, 35, var(--op, .55)); --bg2: rgba(120, 120, 135, .22);   /* --op: quanto o fundo cobre o efeito (1 = solido) */ --tx: #ececee; --mut: #9a9aa6; --bd: #3a3b43; --ac: #4d6bfe; }
html.lt { --bg: rgba(251, 251, 253, var(--op, .55)); --tx: #1b1b20; --mut: #6b6b76; --bd: #d6d6de; }
* { box-sizing: border-box; } html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; } html.solid { --op: 1; } html.mica { --op: .62; } html.acrylic { --op: .5; } html.aero { --op: .4; }
body { font: 14.5px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; color: var(--tx); }
#box { display: flex; flex-direction: column; height: 100vh; background: var(--bg); overflow: hidden; }   /* cantos arredondados e sombra vem do Windows 11 (DWM) */
#log { overflow-y: auto; padding: 12px 16px 4px; display: none; flex-direction: column; gap: 10px; min-height: 0; flex: 1; }
#log.on { display: flex; }
.m { max-width: 92%; white-space: pre-wrap; word-wrap: break-word; } .m.u { align-self: flex-end; background: var(--bg2); border-radius: 14px 14px 4px 14px; padding: 7px 12px; } .m.a { align-self: flex-start; }
.m p { margin: 0 0 .5em; } .m code { background: var(--bg2); border-radius: 5px; padding: 1px 5px; font: .9em Consolas, monospace; } .m pre { background: var(--bg2); border-radius: 10px; padding: 8px 10px; overflow-x: auto; margin: .4em 0; white-space: pre; } .m pre code { background: none; padding: 0; }
.m.err { color: #ff7a7a; } .dots::after { content: "..."; animation: d 1s steps(4) infinite; } @keyframes d { 0% { content: ""; } 33% { content: "."; } 66% { content: ".."; } 100% { content: "..."; } }
#row { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 16px; }
#in { flex: 1; font: inherit; font-family: "Segoe UI", system-ui, sans-serif; font-size: 1.05rem; color: var(--tx); background: none; border: none; outline: none; min-width: 0; } #in::placeholder { color: var(--mut); }
.ib { all: unset; cursor: pointer; color: var(--mut); width: 28px; height: 28px; border-radius: 8px; display: none; align-items: center; justify-content: center; font-size: 15px; } .ib:hover { background: var(--bg2); color: var(--tx); } .ib.on { display: flex; }
.lb { all: unset; cursor: pointer; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex: none; } .lb:hover { background: var(--bg2); } .lb img { width: 20px; height: 20px; border-radius: 6px; }
#hint { color: var(--mut); font-size: .72rem; padding: 0 16px 8px; display: none; } #hint.on { display: block; }
</style></head><body>
<div id="box">
  <div id="log"></div>
  <div id="row"><input id="in" type="text" autocomplete="off" spellcheck="false" placeholder="Pergunte qualquer coisa..."><button class="ib" id="stop" title="Parar">■</button><button class="ib" id="new" title="Nova conversa">+</button><button class="lb" id="lume" title="Abrir esta conversa no Lume"><img src="/apple-touch-icon.png" alt="Lume"></button></div>
</div>
<script>
const API = location.origin, $ = id => document.getElementById(id), log = $('log'), inp = $('in');
const L = () => { try { return (JSON.parse(localStorage.getItem('thingmabobber_config') || '{}').lang || navigator.language || 'pt').slice(0, 2) === 'en' ? 'en' : 'pt'; } catch (e) { return 'pt'; } };
const cfg = () => { try { return JSON.parse(localStorage.getItem('thingmabobber_config') || '{}'); } catch (e) { return {}; } };
let msgs = [], busy = false, ctl = null, shownAt = 0;
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function md(t) {   // markdown minimo: blocos de codigo, `codigo`, **negrito**, *italico*, paragrafos
  const parts = String(t).split(/```/);
  return parts.map((p, i) => i % 2 ? '<pre><code>' + esc(p.replace(/^[\w+-]*\n/, '')) + '</code></pre>' : esc(p).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')).join('');
}
function fit() { try { const h = Math.min(Math.max((log.classList.contains('on') ? log.scrollHeight + 16 : 0) + $('row').offsetHeight, 64), 560); if (window.pywebview && pywebview.api) pywebview.api.resize(h); } catch (e) {} }
function add(role, text) { const d = document.createElement('div'); d.className = 'm ' + (role === 'user' ? 'u' : 'a'); if (role === 'user') d.textContent = text; else d.innerHTML = md(text); log.appendChild(d); log.classList.add('on'); log.scrollTop = log.scrollHeight; fit(); return d; }
function ui() { $('stop').classList.toggle('on', busy); $('new').classList.toggle('on', !busy && msgs.length > 0); inp.placeholder = msgs.length ? (L() === 'en' ? 'Reply...' : 'Responder...') : (L() === 'en' ? 'Ask anything...' : 'Pergunte qualquer coisa...'); }
async function send() {
  const t = inp.value.trim(); if (!t || busy) return; inp.value = ''; msgs.push({ role: 'user', content: t }); add('user', t);
  const out = add('assistant', ''), c = cfg(); out.classList.add('dots'); busy = true; ctl = new AbortController(); ui(); let text = '';
  try {
    const sys = L() === 'en' ? 'You are a quick assistant in a small floating box. Answer directly and briefly.' : 'Voce e um assistente rapido numa caixinha flutuante. Responda direto e curto.';
    const res = await fetch(API + '/api/chat', { method: 'POST', signal: ctl.signal, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: c.model || 'qwen3.5:4b', stream: true, think: false, search_web: false, agent: false, lang: L(), messages: [{ role: 'system', content: sys }].concat(msgs) }) });
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    const one = l => { try { const d = JSON.parse(l); if (d.message && d.message.content) { text += d.message.content; out.classList.remove('dots'); out.innerHTML = md(text); log.scrollTop = log.scrollHeight; fit(); } } catch (e) {} };
    while (true) { const { done, value } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true }); const ls = buf.split('\n'); buf = ls.pop(); ls.forEach(one); }
    one(buf);
    if (/^\s*\[(Erro|Error):/.test(text)) out.classList.add('err');
    if (!text.trim()) { out.classList.remove('dots'); out.textContent = L() === 'en' ? '(no answer)' : '(sem resposta)'; }
    else msgs.push({ role: 'assistant', content: text });
  } catch (e) { out.classList.remove('dots'); if (e.name !== 'AbortError') { out.classList.add('err'); out.textContent = (L() === 'en' ? 'Could not answer: ' : 'Nao consegui responder: ') + e.message; } else if (text) msgs.push({ role: 'assistant', content: text }); }
  busy = false; ctl = null; ui(); fit(); inp.focus();
}
function hide() { try { pywebview.api.hide(); } catch (e) {} }
function reset() { if (ctl) ctl.abort(); msgs = []; log.innerHTML = ''; log.classList.remove('on'); busy = false; ui(); fit(); inp.focus(); }
inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (busy && ctl) ctl.abort(); else hide(); } });
$('stop').onclick = () => ctl && ctl.abort(); $('new').onclick = reset;
$('lume').onclick = () => { try { pywebview.api.open_in_lume(msgs.slice()); reset(); } catch (e) {} };   // leva a conversa para um chat novo no Lume
window.qstyle = (s, dark) => { document.documentElement.className = (s || 'mica') + (dark ? '' : ' lt'); };   // o claro/escuro segue o tema do Windows (o mesmo do vidro)
window.addEventListener('blur', () => { if (Date.now() - shownAt > 400) hide(); });   // clicar fora esconde (o 400 ms evita esconder logo ao abrir)
window.qshown = () => { shownAt = Date.now(); ui(); inp.focus(); inp.select(); fit(); };
ui();
</script></body></html>
